server:
  port: 8081
  servlet:
    context-path: /

spring:
  application:
    name: fraudshield-backend

  # ─── Active Profile ─────────────────────────────────────────────────────────
  # Set to 'prod' when running with docker-compose (Postgres + Redis + Kafka)
  # Set to 'dev'  for local development with H2 in-memory (default)
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # ─── H2 In-Memory Database (dev profile) ────────────────────────────────────
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  # ─── JPA ────────────────────────────────────────────────────────────────────
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  # ─── Spring Security basic auth (used by Actuator) ──────────────────────────
  security:
    user:
      name: admin
      password: admin

  # ─── Flyway (disabled by default; enabled in prod profile) ──────────────────
  flyway:
    enabled: false

# ─── JWT Configuration ────────────────────────────────────────────────────────
jwt:
  secret: ${JWT_SECRET:change-this-in-production-use-a-strong-256-bit-key}
  expiration: 86400000   # 24 hours in milliseconds

# ─── External ML Service (FastAPI) ────────────────────────────────────────────
fraudshield:
  ml:
    service-url: ${ML_SERVICE_URL:http://localhost:8000}
  rate-limit:
    max-requests-per-minute: 10

# ─── SpringDoc / Swagger UI ────────────────────────────────────────────────────
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha

# ─── Logging ───────────────────────────────────────────────────────────────────
logging:
  level:
    com.fraudshield: DEBUG
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.springframework.kafka: WARN

# ─── Actuator ──────────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

---
# ═══════════════════════════════════════════════════════════════════════════════
#  PROFILE: dev  (default — H2 in-memory, no Redis/Kafka required)
# ═══════════════════════════════════════════════════════════════════════════════
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:h2:mem:fraudshielddb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop

  sql:
    init:
      mode: never

  # No Redis / Kafka in dev profile
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

---
# ═══════════════════════════════════════════════════════════════════════════════
#  PROFILE: prod  (PostgreSQL + Redis + Kafka via docker-compose)
# ═══════════════════════════════════════════════════════════════════════════════
spring:
  config:
    activate:
      on-profile: prod

  # ─── PostgreSQL ─────────────────────────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fraudshielddb}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:fraudshield}
    password: ${DB_PASSWORD:fraudshield_secret}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate   # Flyway manages the schema
    properties:
      hibernate:
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true

  # ─── Flyway ─────────────────────────────────────────────────────────────────
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  # ─── Redis ──────────────────────────────────────────────────────────────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis_secret}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 1

  # ─── Kafka ──────────────────────────────────────────────────────────────────
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: fraudshield-backend
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "com.fraudshield.*"
    listener:
      ack-mode: MANUAL_IMMEDIATE
